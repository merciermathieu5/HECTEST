# ============================================================
# HEC · Configuration Sveltia CMS  (compatible Decap CMS)
# ------------------------------------------------------------
# Édite assets/data/questions.json depuis une interface web,
# en écrivant TOUJOURS de la donnée structurée et validée.
# Sveltia lit ce même fichier config.yml que Decap.
# ============================================================

backend:
  name: github
  repo: OWNER/REPO          # <-- À REMPLACER par "ton-compte/ton-depot"
  branch: main              # adapte si ta branche de publication diffère

# Permet de tester l'éditeur en local sans authentification GitHub :
#   1) sers le site :            python3 -m http.server 8000   (dans v2/)
#   2) lance le proxy local :    npx @sveltia/cms-server
#   3) ouvre http://localhost:8000/admin/
local_backend: true

# Dossier des images (pour le widget "image" si tu l'actives plus tard).
media_folder: "assets/img"
public_folder: "assets/img"

# Listes de choix réutilisées (doivent rester synchronisées avec data.js)
# - Opérations intellectuelles : window.DATA.operations_intellectuelles
# - Réalités sociales          : window.DATA.realites_sociales[].id

collections:
  - name: catalogue
    label: "Catalogue de questions"
    editor:
      preview: false
    files:
      - name: questions
        label: "Questions"
        file: "assets/data/questions.json"
        description: >
          Banque de questions composables. Chaque entrée correspond à une
          question atomique rendue dans le cahier .docx.
        fields:
          - name: questions
            label: "Questions"
            label_singular: "Question"
            widget: list
            summary: "{{fields.id}} — {{fields.operation}} #{{fields.numero}}"
            fields:
              - { name: id, label: "Identifiant (unique)", widget: string, hint: "ex. q-causalite-1 — sert de clé ; ne pas dupliquer" }

              - name: operation
                label: "Opération intellectuelle"
                widget: select
                options:
                  - "Établir des faits"
                  - "Situer dans l'espace"
                  - "Situer dans le temps"
                  - "Établir des liens de causalité"
                  - "Mettre en relation des faits"
                  - "Déterminer des causes et des conséquences"
                  - "Dégager des différences et des similitudes"
                  - "Déterminer des changements et des continuités"

              - { name: numero, label: "Numéro", widget: number, value_type: int, min: 1 }

              - name: niveau
                label: "Niveau"
                widget: select
                options:
                  - { label: "Secondaire 1", value: 1 }
                  - { label: "Secondaire 2", value: 2 }
                  - { label: "Secondaire 3", value: 3 }
                  - { label: "Secondaire 4", value: 4 }

              - name: realite_sociale_id
                label: "Réalité sociale"
                widget: select
                options:
                  - { label: "Le renouvellement de la vision de l'Homme", value: "renouvellement-vision-homme" }
                  - { label: "L'expansion européenne dans le monde", value: "expansion-europeenne" }
                  - { label: "La Révolution américaine", value: "revolution-americaine" }
                  - { label: "La sédentarisation", value: "sedentarisation" }
                  - { label: "L'émergence d'une civilisation", value: "emergence-civilisation" }
                  - { label: "Une première expérience de démocratie", value: "premiere-experience-democratie" }
                  - { label: "La romanisation", value: "romanisation" }
                  - { label: "La christianisation de l'Occident", value: "christianisation-occident" }
                  - { label: "L'industrialisation", value: "industrialisation" }
                  - { label: "L'expansion du monde industriel", value: "expansion-monde-industriel" }

              # ---------- Corps de la question ----------
              - name: questionBody
                label: "Énoncé"
                widget: object
                fields:
                  - { name: prompt, label: "Consigne", widget: text }

                  - name: bullets
                    label: "Puces (éléments à relier)"
                    widget: list
                    required: false
                    field: { name: item, label: "Élément", widget: string }

                  - name: instructions
                    label: "Instructions (fragments enrichis)"
                    widget: list
                    required: false
                    label_singular: "Fragment"
                    summary: "{{fields.text}}"
                    fields:
                      - { name: text, label: "Texte", widget: string }
                      - { name: bold, label: "Gras", widget: boolean, default: false }

                  # Espace de réponse : 1 seul, mais de type variable
                  - name: responseSpace
                    label: "Espace de réponse"
                    widget: list
                    max: 1
                    min: 1
                    types:
                      - name: lines
                        label: "Lignes de réponse"
                        fields:
                          - { name: count, label: "Nombre de lignes", widget: number, value_type: int, min: 1 }
                      - name: labeled-list
                        label: "Liste à libellés"
                        fields:
                          - name: items
                            label: "Libellés"
                            widget: list
                            field: { name: item, widget: string }
                      - name: chrono-ordering
                        label: "Mise en ordre chronologique"
                        fields:
                          - name: items
                            label: "Cases (du plus ancien au plus récent)"
                            widget: list
                            field: { name: item, widget: string }
                      - name: before-after-axis
                        label: "Axe avant / après"
                        fields:
                          - { name: beforeLabel, label: "Libellé « avant »", widget: string }
                          - { name: afterLabel, label: "Libellé « après »", widget: string }
                          - { name: pivot, label: "Événement pivot", widget: string }
                      - name: checkbox-table
                        label: "Tableau à cocher"
                        fields:
                          - name: columns
                            label: "Colonnes"
                            widget: list
                            field: { name: col, widget: string }
                          - name: rows
                            label: "Lignes"
                            widget: list
                            field: { name: row, widget: string }

              # ---------- Réglettes d'évaluation ----------
              - name: reglettes
                label: "Réglettes"
                widget: list
                label_singular: "Réglette"
                summary: "{{fields.label}}"
                types:
                  - name: simple
                    label: "Réglette simple (paliers de points)"
                    fields:
                      - { name: id, widget: string }
                      - { name: label, label: "Libellé", widget: string }
                      - { name: opLabel, label: "Opération évaluée", widget: string }
                      - { name: maxPoints, label: "Points max", widget: number, value_type: int, min: 0 }
                      - name: levels
                        label: "Paliers"
                        widget: list
                        summary: "{{fields.points}}"
                        fields:
                          - { name: points, label: "Points", widget: string }
                          - { name: condition, label: "Condition", widget: text }
                  - name: complex
                    label: "Réglette complexe (grille à variantes)"
                    fields:
                      - { name: id, widget: string }
                      - { name: label, label: "Libellé", widget: string }
                      - { name: opLabel, label: "Opération évaluée", widget: string }
                      - { name: maxPoints, label: "Points max", widget: number, value_type: int, min: 0 }
                      - name: rows
                        label: "Lignes de la grille"
                        widget: list
                        summary: "{{fields.points}}"
                        fields:
                          - { name: precise, label: "Préambule (laisser vide si aucun)", widget: string, required: false }
                          - { name: condition, label: "Condition (laisser vide si aucune)", widget: string, required: false }
                          - { name: points, label: "Points", widget: string }

              # ---------- Documents (encadrés) ----------
              - name: documents
                label: "Documents"
                widget: list
                required: false
                label_singular: "Document"
                summary: "{{fields.title}}"
                fields:
                  - { name: id, widget: string }
                  - { name: title, label: "Titre", widget: string }
                  - name: layout
                    label: "Disposition"
                    widget: select
                    options:
                      - { label: "Texte seul", value: "text-only" }
                      - { label: "Image seule", value: "image-only" }
                      - { label: "Texte + image", value: "text-image" }
                  - { name: text, label: "Texte", widget: text, required: false }
                  - { name: imageUrl, label: "Chemin de l'image", widget: string, required: false, hint: "ex. assets/img/causalite-1/img000.png" }
                  - { name: imageWidthCm, label: "Largeur image (cm)", widget: number, value_type: float, required: false }
                  - name: sources
                    label: "Sources"
                    widget: list
                    required: false
                    field: { name: source, widget: string }

              # ---------- Corrigé (4 formes possibles) ----------
              - name: corrige
                label: "Corrigé"
                widget: list
                max: 1
                min: 1
                typeKey: kind
                types:
                  - name: texte
                    label: "Texte (réponse rédigée)"
                    fields:
                      - { name: valeur, label: "Réponse attendue", widget: text }
                  - name: lettres
                    label: "Lettres / positions"
                    fields:
                      - name: valeurs
                        label: "Réponses (dans l'ordre des libellés)"
                        widget: list
                        field: { name: v, widget: string }
                  - name: avant_apres
                    label: "Avant / Après"
                    fields:
                      - name: avant
                        label: "Documents « avant »"
                        widget: list
                        field: { name: v, widget: string }
                      - name: apres
                        label: "Documents « après »"
                        widget: list
                        field: { name: v, widget: string }
                  - name: cases
                    label: "Cases cochées (tableau)"
                    fields:
                      - name: lignes
                        label: "Lignes"
                        widget: list
                        fields:
                          - name: cochees
                            label: "Cases (une par colonne)"
                            widget: list
                            fields:
                              - { name: coche, label: "Cochée", widget: boolean, default: false }
